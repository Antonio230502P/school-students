services:
  school-students-app:
    container_name: school-students
    image: school-students:1.0.0
    build: .
    ports:
      - 8080:8080
    environment:
      - ORACLE_DATABASE_HOST=oracle-db-school-students
      - ORACLE_DATABASE_PORT=1521
      - ORACLE_DATABASE_SERVICE_NAME=FREE
      - ORACLE_DATABASE_USERNAME=C##SCHOOL
      - ORACLE_DATABASE_PASSWORD=LKPW3XVj8crFUB-6CY_f
      - ORACLE_DATABASE_DEFAULT_SCHEMA=C##SCHOOL
      - REDIS_HOST=redis-school-students
      - REDIS_PORT=6379
    depends_on:
      - oracle-db-school-students
      - redis-school-students
  oracle-db-school-students:
    container_name: oracle-db-school-students
    image: container-registry.oracle.com/database/free:23.7.0.0-amd64
    ports:
      - 1521:1521
    environment:
      - ORACLE_PWD=LKPW3XVj8crFUB-6CY_f
    volumes:
      - ./src/main/resources/db/startup:/opt/oracle/scripts/startup
  redis-school-students:
    container_name: redis-school-students
    image: redis:7.4.2
    ports:
      - 6379:6379
